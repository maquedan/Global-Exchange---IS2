{% extends "terminal/base_terminal.html" %}

{% block titulo %}Operación | Terminal Global Exchange{% endblock %}

{% block contenido %}
  <section class="mx-auto w-full max-w-4xl text-center">
    <p class="text-sm font-bold uppercase tracking-[0.2em] text-cyan-300">
      Paso 2 de 4
    </p>

    <h2 class="mt-3 text-3xl font-black text-white">
      ¿Qué querés hacer?
    </h2>

    <p class="mt-4 text-lg text-slate-300">
      Cliente identificado: <strong>{{ cliente }}</strong>
    </p>

    {% if error %}
      <p class="mx-auto mt-6 max-w-xl rounded-xl bg-rose-100 px-4 py-3 font-medium text-rose-900">
        {{ error }}
      </p>
    {% endif %}

    <form method="post" class="mt-10 grid gap-6 sm:grid-cols-2">
      {% csrf_token %}

      <button type="submit"
              name="tipo_operacion"
              value="compra"
              class="flex min-h-52 items-center justify-center rounded-3xl bg-cyan-400 px-8 py-10 text-center text-2xl font-black text-slate-950 shadow-xl transition hover:bg-cyan-300">
        Comprar divisas
      </button>

      <button type="submit"
              name="tipo_operacion"
              value="venta"
              class="flex min-h-52 items-center justify-center rounded-3xl bg-indigo-500 px-8 py-10 text-center text-2xl font-black text-white shadow-xl transition hover:bg-indigo-400">
        Vender divisas
      </button>
    </form>

    <a href="{% url 'terminal:inicio' %}"
       class="mt-8 inline-block rounded-xl border-2 border-slate-500 px-12 py-5 text-lg font-black text-white transition hover:border-cyan-300 hover:bg-slate-800">
    Cancelar operación
    </a>
  </section>
{% endblock %}
